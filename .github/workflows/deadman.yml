# The dead man's handle (phase 0U, U9).
#
# Every other alarm in this repository is inside the pipeline, which means every
# alarm depends on the pipeline running. The failure this exists for is the one
# where it does not run at all:
#
#   * GitHub disables scheduled workflows on a repository with 60 days of no
#     activity. The scheduler comparison in 0k could not establish whether the
#     bot's own commits count as activity, so the possibility stands.
#   * A workflow file with a syntax error does not run and does not fail.
#   * An account or billing problem stops the schedule silently.
#
# In all three the daily job produces nothing — no run-log row, no alert, no
# commit — and "nothing" is exactly what a quiet, healthy Sunday looks like from
# outside. **Absence cannot report itself**, so something else has to notice it.
#
# What it checks is the archive, not the workflow: `content/runs_log/` gets a
# row from every run whatever its verdict, including the failures.
#
# It asks **two** questions about that directory, and until the 08-26 batch it
# asked only the first:
#
#   1. Is the archive still being written to?  Catches the pipeline stopping.
#   2. Is any day inside the horizon missing a row entirely?  Catches a day
#      that was skipped while the ones around it went out.
#
# ★ Those are two questions and 1E finished separating them. Question 1 used to
# measure staleness from the newest row's **date**, which is a fact about which
# day the archive has reached — question 2's job — rather than about when
# anything was last written. It now reads the row's own `recorded_at`. The
# split is clean: **question 1 asks about writing activity, question 2 asks
# about day coverage**, and neither half-answers the other any more.
#
# The second exists because 2026-08-26 has no issue and no row, and this job
# was green throughout. Its 21:00 UTC slot ran late enough to cross midnight,
# the pipeline dated itself from the clock, and the day was published as 08-27.
# So the newest row was *newer* than it should have been and the archive looked
# healthier than it was. **A gap is invisible to any check that only asks how
# recent the last entry is** — the freshness question is not a weaker version of
# the completeness question, it is a different one, and no threshold on the
# first can answer the second.
#
# It runs at 09:00 UTC, twelve hours off the daily's 21:00. Two jobs on the same
# cron die together and a watchdog that dies with the thing it watches is
# decoration.
name: deadman

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read

jobs:
  deadman:
    runs-on: ubuntu-latest
    # 15, not 5: the gap check below installs the project so it can use the same
    # tested code an operator runs by hand. The freshness check above it needs
    # nothing installed and runs first, on purpose — see its step.
    timeout-minutes: 15

    env:
      PYTHONUNBUFFERED: "1"
      # ★ 30 hours, measured from the newest row's `recorded_at` (1E, B).
      #
      # It was 36 hours measured from the row's **date at midnight**, and those
      # two changes belong together — keeping 36 against the new measurement
      # would be a worse alarm than the old one, not a better one.
      #
      # The arithmetic, from this repository's own timings. `daily` fires at
      # 21:00 UTC and records at 22:50–23:26; this job fires at 09:00. So on a
      # healthy morning the newest row is 9.5–10.5 hours old, and the 79 rows
      # in the archive put the worst healthy case at 11.5. After **one missed
      # slot** the same measurement reads 33.6 hours or more. Any limit between
      # those two numbers separates a late watchdog from a stopped pipeline,
      # and 30 sits in the middle:
      #
      #   false alarm   needs this job to run ~20h late, not the 3h it needed
      #                 before. 2026-09-07 was a 5h delay and it alarmed.
      #   detection     unchanged. A missed slot is caught at the very next
      #                 09:00, exactly as 36-from-midnight caught it, because
      #                 the deadman only asks once a day. Replaying 2026-08-21,
      #                 a real missed day, gives 35.3h — still over the limit.
      #
      # **What raising the limit alone would have cost.** Staying on the
      # midnight measurement and going to 48 or 60 would have bought the same
      # margin by pushing detection a whole cycle later: that measurement moves
      # in 24-hour steps at a once-a-day check, so the next threshold up is not
      # a few hours later, it is a day later. Fixing what is measured buys the
      # margin for nothing. What it costs instead is written on the script.
      MAX_AGE_HOURS: "30"

      # How far back the gap check looks, and how much of the recent end it
      # leaves alone. `GRACE_DAYS: 1` is a tolerance on a different question
      # and is left alone: this job runs at 09:00 UTC and the daily slot is
      # 21:00, so the newest day it will call missing is one whose run was due
      # about 36 hours ago. A day inside the grace window may simply be late,
      # and catch-up has not had its turn at it yet.
      HORIZON_DAYS: "7"
      GRACE_DAYS: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Question 1: is the archive still being written to?
      #
      # First, and deliberately dependency-free. This is the check that has to
      # survive the project being unbuildable — `ls`, `sed`, `date` and nothing
      # else. The gap check below is better at what it does and needs `uv sync`
      # to run at all, which is a thing that can break; this one cannot.
      #
      # ★ The arithmetic lives in a script rather than here (1E, B), for one
      # reason: it was wrong for three weeks and no test could have said so.
      # A shell block inside a YAML string cannot be run with a fabricated
      # clock; a file can, and `tests/test_deadman_freshness.py` replays both
      # 2026-09-07 (the false alarm) and 2026-08-21 (a real missed day)
      # against it.
      - name: Check the archive is still being written to
        shell: bash
        run: bash .github/scripts/deadman-freshness.sh

      # Question 2: is any day inside the horizon missing a row entirely?
      #
      # `always()`, so a red freshness check does not hide a gap — the two
      # findings are different and an operator wants both in one place.
      #
      # This is the check 2026-08-26 needed and did not have. `uc missing-days`
      # walks the calendar back from the most recent cron slot and names the
      # days `content/runs_log/` has nothing at all for. It is the same command
      # `docs/OPERATIONS.md` tells a person to run, rather than a second
      # implementation of the rule in bash: the whole failure being fixed here
      # came from two places disagreeing about what day it was.
      - name: Install
        if: always()
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Look for days with no row at all
        if: always()
        shell: bash
        run: |
          set -uo pipefail

          # Fail loudly and separately if the install is what broke, rather than
          # letting `uc missing-days` fail for that reason and reporting a gap
          # that was never measured.
          if ! uv python install 3.11 || ! uv sync --frozen --quiet; then
            echo "::error::The deadman could not install the project, so the gap check did not run. This is not a gap; it is a missing measurement."
            exit 1
          fi

          out="$(uv run uc missing-days --days "$HORIZON_DAYS" --grace "$GRACE_DAYS" 2>&1)"
          code=$?
          echo "$out"

          {
            echo ""
            echo "### Gaps"
            echo ""
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$code" -ne 0 ]; then
            echo "::error::A day inside the ${HORIZON_DAYS}-day horizon has no run-log row. It was never attempted, or it was attempted under the wrong date — see docs/OPERATIONS.md, 'A day with no row'."
            {
              echo ""
              echo "**A day inside the horizon has no run-log row at all.**"
              echo ""
              echo "Catch-up retries such days automatically on the next daily run,"
              echo "so a gap that is still here has already survived one attempt."
              echo "Dispatch \`daily\` by hand with that \`date\` while it is still"
              echo "inside \`daily.catch_up_days\` — past the horizon it cannot be"
              echo "recovered."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
