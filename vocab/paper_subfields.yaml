# Excluded — seen often enough to judge, and judged against:
# ★ Re-checked in 0P (Q3) against `runs/labels/subfield_check.jsonl`, five
# papers drawn per excluded subfield and judged on purpose. The rule was written
# before the judgements were read: **a subfield with a keep in it comes off the
# list.** Two did.
#
# The two rates below are from **different sampling frames and are not added
# together.** `relevance` is a ranked top-N sample; `subfield_check` is five
# papers drawn per subfield. Each says what it says about its own draw.
#
#   subfield  relevance (ranked)  subfield_check (targeted)  verdict
#   1408      keep 1/3            keep 5/5                   INCLUDED
#   2208      keep 2/5            keep 2/3                   INCLUDED
#   2306      keep 1/4            not judged (0 of 5)        stays out, UNMEASURED
#   3312      keep 1/6            not judged (0 of 4)        stays out, UNMEASURED
#
# 2306 and 3312 are **not confirmed exclusions**. Nobody has judged a paper in
# them under this frame yet, and "no keep observed" where nothing was observed
# is the measured-zero mistake. They remain excluded because that is the state
# they were in, not because the check endorsed it. Finish
# `uc review --label subfield_check` and re-run this.
excluded:
  - id: "3312"    # relevance keep 1/6; subfield_check 0 of 4 judged - UNMEASURED
  - id: "2306"    # relevance keep 1/4; subfield_check 0 of 5 judged - UNMEASURED
