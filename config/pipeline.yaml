# Pipeline configuration. Values here are meant to be tuned during Phase 0.

arxiv:
  # PRD §5.1
  categories: [cs.CY, cs.SI, cs.LG, cs.CV, cs.AI, stat.AP, physics.soc-ph]
  request_interval_s: 5.0      # PRD §5.1 asks for >= 3s; 5 avoids 429s in practice
  max_retries: 3
  # 1000 rather than 200. A 90-day backfill is ~39,000 items; at 200 per request
  # that is ~200 requests and arXiv starts returning 429 partway through, which
  # costs far more time than the larger responses do. Measured: a 1000-entry
  # page returns in ~3s.
  page_size: 1000
  api_url: "http://export.arxiv.org/api/query"

openalex:
  # A free key gives a $1/day budget. We stop a stage at 80% of it.
  daily_budget_usd: 1.0
  budget_stop_fraction: 0.8
  per_page: 100          # hard maximum as of 2026-08; the docs previously said 200
  arxiv_source_id: "S4306400194"
  # Subfields used to build the journal whitelist (PRD §5.4).
  whitelist_subfields: ["3322", "3305", "3313"]
  whitelist_max_sources: 200

  # ★ HTTP deadlines. pyalex 0.21 passes no `timeout` to requests, and requests
  # waits forever by default — one stalled connection held the backfill for
  # forty days' worth of dates (phase 0N, P0). The sibling collectors already
  # had deadlines (arXiv 60s, abstracts 30s), which is why neither ever hung.
  #
  # Split because they fail differently: a refused connection is fast, and a
  # stalled read is what actually happened.
  connect_timeout_s: 15.0
  read_timeout_s: 60.0

  # `paginate(n_max=None)` is unbounded. Not the cause of the 07-02 hang, which
  # stopped before the first page, but an unbounded loop behind a network call
  # is the next accident in the same place.
  max_records_per_query: 5000

embedding:
  provider: local              # local | none. Swappable for a hosted API later.
  model: "BAAI/bge-base-en-v1.5"
  batch_size: 32

classifier:
  # Calibrated probability, so this cut is interpretable. Set from the measured
  # per-source sweep in models/clf-*.json rather than left at 0.5:
  #
  #   thr    arXiv-urban recall   journal recall   negative FPR   holdout precision
  #   0.50         0.682               0.995          0.044            0.953
  #   0.35         0.768               0.998          0.094            0.907
  #   0.25         0.820               0.998          0.142            0.867
  #
  # At 0.5 the model drops a third of the arXiv urban papers this product exists
  # to surface. Recall is worth more than precision here because `select_top_n`
  # already caps daily volume and items are ranked by score — a lower floor
  # changes what can reach the list, not how long the list is.
  # REVIEW: YJUN's call. 0.25 buys 5 more points of arXiv recall for 4 points of
  # precision; 0.5 is the conservative end.
  # Which trained model is in production. Named explicitly: with several
  # variants on disk, picking the last filename alphabetically selects v3, which
  # the comparison showed is the worst of the three.
  model_version: "clf-v2-2026-08-13"

  threshold: 0.35
  select_top_n: 24             # kept for reference; selection.slots is authoritative
  holdout_fraction: 0.2
  random_state: 42

selection:
  # Two independent entry paths (roadmap §2.1). A whitelist-journal article
  # enters on membership and never touches the classifier; an arXiv preprint
  # enters on classifier probability. Each path owns its slots, which is why the
  # old `classifier.arxiv_min_share` quota is gone — it was treating a symptom.
  # A path that cannot fill its slots lends them to the other, and the run
  # records that it happened.
  # REVIEW: YJUN's call on the split.
  slots:
    journal: 12
    # `arxiv` is no longer read by the selection stage — the arXiv path is
    # governed by `arxiv.floor` and `arxiv.max` below (phase 0i, V1-1). Kept
    # because the backfill and the calibration still pass explicit slot counts.
    arxiv: 12

  # arXiv publishes by quality, not by quota. 90 relevance labels over 3 days:
  # >=0.80 was 9 keeps out of 9, 0.70-0.80 was 4 out of 9, and below 0.70 was a
  # third. Filling twelve slots meant reaching into the last of those every day.
  #
  # The 90-day backfill says a 0.80 floor yields a median of 3 arXiv candidates
  # a day (p25 2, p75 5) against 6 at 0.70. Three good preprints is the correct
  # output of a day with three good preprints; twelve was a number, not a
  # finding. Nine of nine is not proof either — the 95% lower bound is near
  # 0.67 — so this is "no observed failures in nine", and more labels can move it.
  #
  # THIS IS A PUBLICATION FLOOR, NOT `classifier.threshold`. The threshold still
  # decides candidacy and the labelling sample is drawn from the candidate pool,
  # so the 120 labels keep meaning what they meant.
  arxiv:
    floor: 0.80
    max: 12

  journal:
    # What the journal path may expand to when arXiv is under its ceiling.
    # 15 is the deepest rank the labels reach — precision by depth holds at
    # 0.64-0.79 through rank 15 and there is no evidence past it. Publishing
    # deeper than we have measured is the thing this cap exists to prevent.
    max: 15
  # How the journal path ranks its candidates. The path has no ranking today —
  # every whitelist article scores relevance 1.0 by membership — and the rebuilt
  # whitelist would take candidates from about 51 a day to about 90 for the same
  # 12 slots, so the twelve would be chosen arbitrarily.
  #
  # placeholder      : current behaviour (journal_rank_score)
  # venue_prior      : subfield-normalised journal metric (phase 0g T2)
  # canon_affinity   : overlap with the foundation canon (phase 0g T3-2)
  # composite        : both
  #
  # DEFAULT STAYS placeholder. YJUN has labelled 30 items and the label file
  # records the rank each was shown at; changing the ranking before labelling
  # finishes would leave those labels attributable to no ranking at all.
  journal_ranking: placeholder

llm:
  # gemini | anthropic. The Anthropic path is kept working; the account simply
  # has no credit. Summaries and extraction can move to different providers
  # later — that is why this is not hard-coded.
  provider: gemini
  model: "gemini-3.5-flash"
  max_tokens: 1200

  # Thinking OFF, and this is a cost setting, not a quality one. Gemini 3.x
  # bills reasoning tokens as output. Measured on a one-word prompt:
  # thinking_level="low" -> 95 thought tokens, thinking_budget=0 -> 0.
  # This work is formatting, not reasoning.
  thinking: false

  cache_enabled: true

  # Hard stops so a development loop cannot burn the budget quietly.
  #
  # `max_calls_total` is per task and counts calls, not money — it is a
  # runaway-loop guard, and `max_spend_usd` is the one that guards the wallet.
  # Raised from 200 in phase 0c: a prompt version bump necessarily invalidates
  # that task's cache, so 0.3.0 -> 0.4.0 (the no-verbatim rule) means
  # re-summarising the whole archive, and 148 + 120 already crossed the old
  # ceiling. Measured spend at the time: $0.76 of the $10 that actually binds.
  # Raised from 60 in phase 0f. It is a guard against a development loop, and a
  # deliberate batch is not one: S3 extracts over a 300-item stratified sample
  # to grow the vocabulary, which 60 cannot finish. The wallet is still guarded
  # by max_spend_usd, and extraction is the cheap task (~$0.002 a call).
  max_calls_per_run: 400
  # Per task, cumulative. Raised for the 60-day backfill (phase 0L, N1), which
  # needs roughly 1,440 summarize and 1,440 extract calls on top of the 361 and
  # 529 already spent. These are runaway-loop guards, not the budget: the batch
  # ceiling is `backfill.max_usd` and the wallet guard is `max_spend_usd`.
  max_calls_total: 2500
  # Cumulative spend across the project. $2.37 is already gone and the backfill
  # is budgeted at $9.00, so 10.0 would have stopped it two thirds of the way
  # through — and stopping mid-backfill leaves the archive with a hole exactly
  # where the measurements need it continuous.
  max_spend_usd: 14.0

  # Per-task overrides. Each task owns its prompt version, so editing one
  # prompt does not invalidate the other's cache (the reason D8 was reverted).
  summarize:
    prompt_version: "summarize/papers@0.4.0"
    max_tokens: 900
  extract:
    prompt_version: "extract/overlay@0.1.0"
    max_tokens: 600
  # One call per issue, and only on days with measured connections to write
  # about. Short by design: the paragraph is three to five sentences and a
  # bigger budget would only buy room to pad.
  synthesis:
    prompt_version: "synthesis/daily@0.2.0"
    max_tokens: 400

gate:
  # Low-volume, high-yield categories skip the keyword gate entirely (PRD §5.3).
  ungated_categories: [cs.CY, cs.SI, stat.AP, physics.soc-ph]
  gated_categories: [cs.LG, cs.CV, cs.AI]

review:
  minutes_saved_per_item: 7

citation:
  # Bibliographic coupling: two papers sharing references. Computable the day
  # both appear, which is the point — co-citation needs the field to have
  # reacted, and this does not.
  #
  # Minimum shared references to record a pair. One or two shared references is
  # mostly coincidence in a field with a common canon; the measured distribution
  # is in the phase 0d report.
  min_shared_references: 3
  # Coupling over the whole archive is O(n^2) and the archive grows daily.
  # Pairs are only computed within this many days of each other, which is also
  # the honest scope: "read this alongside" is a claim about what is current.
  coupling_window_days: 90
  # Canon candidates: how many of the most-cited works to resolve and keep.
  canon_top_n: 300
  # Entry to the canon list: our own corpus cited it at least this many times.
  # One citation is one paper's reading list; two is a shared reference.
  canon_min_citations: 2
  # venue | subfield | both.  was the original rule — published in a
  # whitelist journal — and it let a 159-entry operational list overrule our own
  # corpus.  excludes generic research instruments by OpenAlex
  # classification instead (vocab/canon_exclude_subfields.yaml), which is what
  # the exclusion is actually about. Kept switchable so the change is testable.
  canon_scope_mode: subfield
  # A citation from a recent item counts for more. Half-life in days: an item
  # published a year ago contributes about a quarter of a fresh one.
  canon_half_life_days: 180

canon:
  # Daily accumulation takes at most this share of the OpenAlex day budget.
  # The collectors need the rest: a canon that crowds out collection has its
  # priorities backwards. What the budget cannot resolve waits in
  # runs/state/canon_pending.jsonl and is tried first the next day, and the
  # queue length goes into metrics so a queue that only grows is visible.
  # Which class a rotating canon card draws from first. `foundation` is what
  # the field is built on; `instrument` is what it runs on. Both lists are
  # kept and both are worth publishing, but the default lead is foundation.
  card_class_priority: [foundation, instrument]
  daily_budget_fraction: 0.2
  # And a wall-clock ceiling, which is the one that actually binds. On cost
  # alone a fifth of the day budget buys 50,000 ids, or 1,000 requests and the
  # better part of an hour. 40 requests is 2,000 ids a run.
  max_requests_per_run: 40

render:
  # The canon card ("Still cited"). OFF, and not out of caution: V4 measured
  # our canon against 48,753 externally ranked works and found the top 200 is
  # missing 174 of them, concentrated in physical activity and travel behaviour.
  # A daily card built on a canon with a hole that shape would put a transport
  # paper forward every morning as a pillar of the field. YJUN has not judged
  # the canon yet and this switch must not decide it.
  still_cited: false

daily:
  # `uc daily` runs against a *window* of publication dates, not a single day,
  # because the issue is dated by when we saw the papers rather than when they
  # appeared (phase 0k, X1). Journals reach 95% coverage at D+2 and no arXiv
  # item has ever been visible on its own publication day.
  #
  # 7 days back, ending yesterday, and the width is set by the slower of the two
  # sources rather than by the faster one.
  #
  # This was 3, which was set from the journal measurement alone. The first real
  # `uc daily --dry-run` then collected 2026-08-15..17 and fetched ZERO arXiv
  # items while the journal side worked normally — with every stage reporting OK.
  # scripts/arxiv_visibility.py asked arXiv day by day and found the boundary:
  # D-1, D-2 and D-3 all return 0, D-4 through D-10 return 221 to 453. Weekends
  # are populated (Sat 08-08: 221, Sun 08-09: 223), so the three empty days are
  # arXiv's submittedDate index lagging, not a quiet weekend.
  #
  # A 3-day window therefore sat entirely inside arXiv's blind zone. A scheduled
  # run would have published a journal-only issue every single morning and
  # recorded collect.arxiv: OK while doing it — a whole source missing with
  # nothing anywhere saying so.
  #
  # 7 gives three days of slack past the measured 3-day gap. Re-collecting days
  # already seen costs a few requests and nothing else: an item already
  # published is skipped, never published twice.
  lookback_days: 7
  min_lag_days: 1

  # A day that costs more than this in LLM calls stops and publishes nothing.
  # A truncated issue claims a scope it did not cover, and the whole point of
  # the outcome model is that we would rather say nothing than say that.
  # Measured: a full day costs about $0.14 in summaries.
  max_llm_usd: 1.0

  # How far back a catch-up run will retry days it could not see. Beyond this a
  # missed day stays missed and stays in the log — chasing it forever would mean
  # re-collecting a window whose sources have moved on.
  catch_up_days: 7

  # ★ Wall-clock budget. The run checks this between stages and stops itself,
  # recording `not_published` with the stage it ran out in.
  #
  # **This must stay comfortably under `timeout-minutes` in
  # .github/workflows/daily.yml (currently 45).** When CI killed the job at 45
  # the pipeline recorded nothing at all — no run-log row, no alert, no commit —
  # and to `uc status` the day was indistinguishable from one the scheduler
  # never fired on. Being stopped by the platform means losing the record;
  # stopping yourself means keeping it.
  #
  # Changing one of the two numbers without the other is exactly how that
  # silence comes back, which is why both carry this comment.
  max_minutes: 30

  # The cheap path for step 1 of the turn-on checklist (`uc daily --smoke`).
  # Step 1 only has to prove the install, the model and the keys work, and it
  # was collecting the full seven-day window and summarising everything — the
  # most expensive thing the pipeline does, with the result discarded. That is
  # the run CI killed at 44 minutes.
  #
  # The window ends past arXiv's 3-day indexing lag so both sources actually
  # return something: a smoke test that collects nothing proves nothing.
  smoke_days: 2
  smoke_lag_days: 4
  # Capped, not skipped. Three summaries exercise the key, the schema and the
  # parsing exactly as well as thirty.
  smoke_summaries: 3

deliver:
  # `file` writes an .eml and sends nothing. It is the default and it stays the
  # default until YJUN picks a provider and fills in the credentials — a
  # pipeline that can mail strangers by accident is not a pipeline anyone should
  # leave running unattended.
  #
  # `smtp` needs UC_SMTP_USER and UC_SMTP_PASSWORD in .env plus a host here.
  # If any of the three is missing the backend falls back to `file` and records
  # the fallback, because a missing password should cost a send, not a day.
  backend: file
  sender: "Urban Currents <urban-currents@localhost>"
  smtp:
    host: null
    port: 587

  # RFC 8058 one-click needs an endpoint, and there is no domain yet. Left null
  # so no header is emitted at all: a List-Unsubscribe pointing nowhere is worse
  # than none, because the client shows the button and the reader presses it.
  # The plain-text body carries a reply-to-unsubscribe instruction meanwhile.
  unsubscribe_url: null
  unsubscribe_mailto: null

site:
  # No domain yet. Empty means every link is relative, so the built site
  # opens from the filesystem and the feed carries relative hrefs. An
  # absolute URL invented before the domain exists would be a link to
  # nowhere printed in an email (phase 0k, X4).
  base_url: ""

held:
  # The held queue (phase 0L, M2-2). Nobody reviews before publication any more,
  # so the doubtful items are withheld rather than published, and the day goes
  # out with a hole. A hole is the correct answer: a slot filled with something
  # we are unsure of is worth less than a shorter issue, and a reader cannot
  # tell the two apart.
  #
  # Held items are NOT carried into the next issue. They are waiting for a
  # verdict, not owed to readers.
  enabled: true

  # ★ R1 records, it does not remove. Measured (phase 0L, N3): gating on the
  # paper's own subfield loses 27 of 44 keeps in the labels — 61% — and takes
  # 59% and 79% of two backfilled days. The papers it withheld were urban heat
  # risk, GIS accessibility, park climate adaptation, food deserts.
  #
  # `whitelist_subfields` was built to choose journals, and OpenAlex scatters
  # individual urban articles across a dozen other subfields. Using a
  # journal-selection list to judge an article is the mistake phase 0e already
  # made once with `journals.yaml`.
  #
  # Set true to enforce, once the subfield list has been re-derived from
  # articles. Until then the rule still fills the labelling queue, which is
  # what it is actually good for.
  # Enforced again as of phase 0N (P2), against `vocab/paper_subfields.yaml`
  # rather than the journal-selection list. Pre-registered conditions, both met:
  # keep loss 0.0676 (limit 0.10, old rule 0.614) and withheld rate 0.2217
  # (limit 0.30) over the backfilled archive.
  off_subfield_withholds: true

  # A day that withholds more than this is not filtering, it is replacing the
  # editorial policy — 59% and 79% were not issues, they were wreckage. It does
  # NOT block publication: refusing to publish would lose the whole day instead
  # of part of it. It records a warning so the drift is visible.
  withheld_rate_warn: 0.30

  # R2: the band where the classifier is closest to a coin flip. These sit below
  # the 0.80 publication floor and are not published either way — they are held
  # because a judgement here buys more than a judgement at the top of a ranking
  # the model already gets right.
  uncertain_from: 0.50
  uncertain_to: 0.80

  # R3: above the floor by less than the model's own calibration error is not
  # meaningfully above the floor.
  #
  # ★ That calibration error was an assumption when this was written. Measured
  # in 0P (Q1) over the 73 arXiv relevance labels: expected calibration error
  # **0.1397**, largest single-band gap 0.2117 — both far larger than 0.03.
  # Pre-registered condition was "smaller than 0.03, shrink the margin to it;
  # larger, keep it and write the number down". It is larger, so the margin
  # stays and the justification is now a measurement.
  #
  # Two things the same measurement says that this rule does NOT act on, and
  # must not be quietly tuned to:
  #  - The error at the top is **under**-confidence, not noise: in [0.80,0.90)
  #    the mean score is 0.861 and the observed keep rate is 1.00 (n=5). If that
  #    holds, items just above the floor are better than their score says, and
  #    withholding is the wrong response to it.
  #  - **Zero** relevance labels fall in the withheld window [0.80,0.83), so the
  #    window itself is unmeasured. The only judgements touching it are 2 rows
  #    from `code_probe`, a different sampling frame that cannot be pooled with
  #    relevance; within their own frame both are `keep`.
  # 35 items in 57 held days were withheld by this margin. Deciding it on 2
  # borrowed rows would be tuning a rule to the cases we happen to have seen.
  floor_margin: 0.03

backfill:
  # The archive is five days long and almost every second-order measurement in
  # the last four batches ended in "too few". `uc backfill-issues` makes the
  # missing issues from candidates already on disk (phase 0L, N1).
  #
  # Batch ceiling. Measured: $0.144 a day, so 60 days is about $8.64. The run
  # stops here and reports how far it got rather than quietly going over.
  max_usd: 9.00
  # Committed in blocks. Sixty days in one commit is a revert that is all or
  # nothing; a checkpoint is written after every single day regardless.
  commit_every: 10
  # Per day, and deliberately larger than `daily.max_minutes`. A backfill day
  # that spends most of its time waiting for the free tier's rate limit is
  # succeeding slowly, not hanging, and the daily budget would kill it for that.
  max_minutes_per_day: 60
