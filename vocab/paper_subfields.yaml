# Paper-level subfields — which OpenAlex subfields our own labels say are ours.
#
# NOT `openalex.whitelist_subfields`, and that list is untouched. That one
# chooses *journals* (3305, 3313, 3322) and using it to judge *articles* is a
# category error: `Landscape and Urban Planning` is an urban journal whose
# papers carry environmental-science, ecology and public-health subfields.
#
# Measured cost of the confusion (phase 0L, N3): gating articles on the
# journal list lost 27 of 44 keeps — 61.4% — and left no day with enough
# label coverage to compute a precision at all.
#
# Derived here from our own labels (phase 0N, P2), by a rule written before
# the numbers were read:
#
#   include a subfield if fewer than 3 labelled papers carry it (thin
#   evidence is not evidence against — excluding on absence is the
#   measured-zero mistake this project keeps making), OR if its keep rate is
#   at least 0.5, the keep rate of a coin flip.
#
# Result: 42 subfields in, 4 out.
#   keep loss   0.0676  (limit 0.1, old rule 0.614)
#   withheld    0.1394  (limit 0.3)
#
# This is a weak gate on purpose. It removes only subfields our labels have
# actually seen and actually rejected; everything unseen passes. Its value is
# not that it filters hard, it is that it stops filtering out our own subject.
#
# Re-derive with: uv run python scripts/paper_subfields.py

subfields:
  - id: "1110"    # keep 3/4
  - id: "1202"    # thin evidence
