# Tests and lint, on every push and pull request (phase 0U, U8).
#
# There were 652 tests and a `ruff` config in this repository and **nothing ran
# either of them automatically**. The only workflows were `daily` and `weekly`,
# both of which run the pipeline rather than check it, so a commit that broke
# the suite would have been found by the next person to type `pytest` — or by
# the daily run failing in production, which is a worse place to find out.
#
# `tests/` promises "no network, no keys", so this needs neither secrets nor the
# embedding model. That promise is worth something precisely here: it is what
# lets the test suite run on a pull request from anyone.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer commit makes an older run's answer irrelevant, unlike `daily`, where
  # a queued run waits because it holds a lock on real output.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        # ★ Pinned, and pinned to **3.11** because that is what production
        # runs. `daily`, `weekly` and `deadman` have all said `uv python
        # install 3.11` since they were written; `ci` and `pages` said
        # `uv python install`, which means "whatever is newest today".
        #
        # On 2026-10-11 that became CPython 3.15.0, for which scipy 1.18.0
        # (a transitive dependency of scikit-learn) publishes no wheel. `uv`
        # fell back to the sdist, the meson build asked for OpenBLAS, which
        # `ubuntu-latest` does not carry, and `uv sync --frozen` died:
        #
        #   error: Failed to build `scipy==1.18.0`
        #   ../scipy/meson.build:296:11: ERROR: Dependency "OpenBLAS" not found
        #
        # Nothing in this repository changed. `main`'s own tip went from green
        # on 10-07 to red on a re-run on 10-11 with no commit in between, which
        # is the proof that the interpreter moved and we did not.
        #
        # An unpinned interpreter also meant CI was not testing what `daily`
        # runs. That is the worse half of the bug: a suite green on an
        # interpreter production never uses answers a question nobody asked.
        run: uv python install 3.11

      - name: Install
        run: uv sync --frozen

      # Lint first: it is seconds, and a failure here is cheaper to read than a
      # test failure caused by the same typo.
      - name: Lint
        run: uv run ruff check .

      - name: Test
        # No secrets in `env`, deliberately. If a test starts needing a key it
        # has stopped being a unit test, and the suite's own promise —
        # "tests must pass with no API keys present and no network" — is the
        # thing that keeps them honest.
        run: uv run pytest -q
