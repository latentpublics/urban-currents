# The daily run — committed, and deliberately NOT enabled.
#
# `workflow_dispatch` only. The `schedule:` block below is commented out, and
# turning it on is a decision with a bill and a mailing list attached: see
# docs/OPERATIONS.md §"Turning the schedule on" for the checklist, which is
# ordered so that nothing can reach a stranger before someone has read what it
# would have said.
#
# Why this file exists before it runs: a scheduler that is written the day it is
# needed is written under time pressure, and the parts that get skipped are the
# ones that matter here — the lock, the conflict handling, the alert. It is
# easier to review a workflow nobody is depending on yet.

name: daily

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Issue date (YYYY-MM-DD). Blank means today."
        required: false
        type: string
      dry_run:
        description: "Run everything, write nothing, send nothing."
        required: false
        default: true
        type: boolean

  # DO NOT UNCOMMENT WITHOUT WORKING THROUGH docs/OPERATIONS.md FIRST.
  #
  # 06:00 KST = 21:00 UTC the previous day. GitHub's scheduler is best-effort
  # and routinely runs late under load, which is fine: the window is three days
  # wide and `uc catch-up` retries anything missed for a week. A cron that fires
  # an hour late costs nothing here; one that never fires is caught by the
  # missing run-log row, not by anybody noticing the mail did not arrive.
  #
  # schedule:
  #   - cron: "0 21 * * *"

# One run at a time, and a queued run waits rather than cancels: the pipeline
# holds its own file lock, and a cancelled job would leave that lock behind for
# the stale-reclaim path to clean up later. Belt and braces, cheaply.
concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write   # only to commit content/ and the run log. Nothing else.

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          # A shallow clone is enough: nothing in the pipeline reads history.
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.11

      # The embedding model is 440 MB and downloading it every morning is both
      # slow and rude to the host. Keyed on the model name from config, so a
      # model change misses the cache instead of silently using the old one.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-base-en-v1.5
          restore-keys: hf-${{ runner.os }}-

      - name: Install
        run: uv sync --extra embed --frozen

      - name: Run the day
        id: run
        env:
          OPENALEX_KEY: ${{ secrets.OPENALEX_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SPRINGER_API_KEY: ${{ secrets.SPRINGER_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          UC_SMTP_USER: ${{ secrets.UC_SMTP_USER }}
          UC_SMTP_PASSWORD: ${{ secrets.UC_SMTP_PASSWORD }}
          UC_PREVIEW_RECIPIENT: ${{ secrets.UC_PREVIEW_RECIPIENT }}
          UC_ALERT_RECIPIENT: ${{ secrets.UC_ALERT_RECIPIENT }}
        run: |
          set -o pipefail
          args=""
          if [ -n "${{ inputs.date }}" ]; then args="--date ${{ inputs.date }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then args="$args --dry-run"; fi
          # `uc daily` exits 1 on not_published. That is a real outcome with a
          # logged reason and an alert already sent, not a crash — so the run
          # continues to the commit step, which will record the missed day.
          uv run uc daily $args || echo "not_published=1" >> "$GITHUB_OUTPUT"

      # Retry the days we could not see. Skipped on a dry run and on a manual
      # run for one specific date, where the operator asked for that date only.
      - name: Catch up on missed days
        if: ${{ inputs.dry_run != true && inputs.date == '' }}
        env:
          OPENALEX_KEY: ${{ secrets.OPENALEX_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SPRINGER_API_KEY: ${{ secrets.SPRINGER_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          UC_ALERT_RECIPIENT: ${{ secrets.UC_ALERT_RECIPIENT }}
        run: uv run uc catch-up || true

      - name: Build the site
        if: ${{ inputs.dry_run != true }}
        run: uv run uc site --no-review

      # `content/` is the pipeline's output and the only thing worth persisting
      # from a run. `site/` is not committed: it is regenerable in a second and
      # a daily HTML diff would bury every real change.
      - name: Commit content
        if: ${{ inputs.dry_run != true }}
        run: |
          set -e
          git config user.name  "urban-currents[bot]"
          git config user.email "urban-currents@users.noreply.github.com"
          git add content/
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "content: $(date -u +%Y-%m-%d) run"

          # Someone may have pushed while we ran — a review edit, a config
          # change. Rebase and retry ONCE. If the second attempt also fails,
          # stop and alert: two failures in a row means a genuine conflict, and
          # a conflict in published content is a thing a person must look at.
          #
          # NEVER force push. The content directory is the archive; discarding
          # someone else's commit to make a bot's push succeed is the one
          # failure mode here that cannot be undone by running again.
          if ! git push; then
            echo "push rejected — rebasing onto origin and retrying once"
            git pull --rebase --no-edit origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Report
        if: always()
        run: uv run uc status || true

      # A workflow that fails silently is the same failure this whole phase is
      # about. The pipeline alerts by mail on `not_published`; this catches the
      # case the pipeline could not reach — the job itself dying, which mails
      # nobody because nothing got far enough to try.
      - name: Fail the job if the day was not published
        if: ${{ steps.run.outputs.not_published == '1' && inputs.dry_run != true }}
        run: |
          echo "::error::No issue was published. See the run log and uc status."
          exit 1
