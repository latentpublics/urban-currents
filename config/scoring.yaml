# Headline score weights (PRD §5.6). Tuning these during Phase 0 is expected.
weights:
  relevance: 0.40
  source_multiplicity: 0.20
  artifact_completeness: 0.20
  novelty: 0.20

# Cluster size at which source_multiplicity saturates at 1.0.
source_multiplicity_saturation: 3

# artifact_completeness contributions; capped at 1.0.
artifact_completeness:
  code: 0.4
  data: 0.4
  published: 0.2

# Quiet-day threshold. Calibrated from the 90-day backfill distribution so that
# the headline rate lands in 30-50% (PRD §5.6, Q3). `uc calibrate` rewrites this.
headline_threshold: 0.444
calibration:
  quantile: 0.6333
  headline_rate: 0.3667
  n_published: 2157
  n_days: 90
  calibrated_at: 2026-08-13
  source: "backfill"
  provisional: true
  # PROVISIONAL: 63% of daily top scores share one value — the threshold splits a tie, not a distribution
  # PROVISIONAL: on the arxiv path 3 of 4 weighted components are one value for 90%+ of published items (artifact_completeness, novelty, source_multiplicity) — the weights do not describe what ranks
  # PROVISIONAL: on the journal path 4 of 4 weighted components are one value for 90%+ of published items (artifact_completeness, novelty, relevance, source_multiplicity) — the weights do not describe what ranks
