[project]
name = "urban-currents"
version = "0.2.0"
description = "Urban Currents Phase 0 — a daily scan of urban data science research"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "google-genai>=2.17.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "joblib>=1.4",
    "numpy>=1.26",
    "pyalex>=0.21",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "scikit-learn>=1.5",
    "typer>=0.12",
]

[project.optional-dependencies]
# Local embeddings. Heavy (torch); split out so CI and unit tests do not need it.
embed = [
    "sentence-transformers>=3.0",
]

[project.scripts]
uc = "pipeline.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
