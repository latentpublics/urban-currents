# The weekly summary — **enabled** in 0U (U9).
#
# Seven days of outcomes, spend and sends, in one mail. It is cheap and
# stateless — reads `content/runs_log/`, writes nothing — so it needs neither
# the embedding model nor write permission.
#
# Turned on for two reasons and the second is the real one:
#
#   1. the summary itself, once a provider exists;
#   2. **it is a heartbeat.** Everything else in this repository only notices a
#      problem when the pipeline runs. If the daily schedule stops firing —
#      GitHub disables schedules on repositories with 60 days of no activity,
#      and the scheduler comparison in 0k could not establish whether the bot's
#      own commits reset that clock — there is nothing to notice it with.
#
# Because `deliver.backend` is `file`, the mail reaches nobody. So the signal
# is **the job's own outcome**: `uc weekly --send` now exits non-zero when the
# send did not reach anybody, and a red run in this repository's Actions tab is
# a thing that arrives in a person's inbox.

name: weekly

on:
  workflow_dispatch:

  # 07:00 KST Monday = 22:00 UTC Sunday. After the daily run, so the week it
  # summarises includes the morning it is sent.
  schedule:
    - cron: "0 22 * * 0"

permissions:
  contents: read

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # See daily.yml — a cancelled job loses an unflushed buffer entirely.
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv python install 3.11

      # No `--extra embed`: the summary reads log files. Installing torch to
      # count seven JSON files would be four minutes for nothing.
      - run: uv sync --frozen

      # With `deliver.backend: file` — the default, and what is committed —
      # this writes an .eml into the runner's filesystem and the runner is then
      # destroyed. **So this step is expected to fail every Sunday until a
      # provider is chosen**, and that is the design: `uc weekly --send` now
      # exits non-zero when the send reached nobody (0U, U9), GitHub mails the
      # owner when a scheduled workflow fails, and that mail is currently the
      # only route by which "this repository's cron is still alive" arrives in
      # a person's inbox. The checklist in OPERATIONS.md sets the backend last;
      # when it is set, this goes green and starts meaning something else.
      #
      # The summary is written into the job page either way, so a red run is
      # still readable — `pipefail` keeps the command's exit code rather than
      # `tee`'s.
      - name: Send the summary
        env:
          UC_SMTP_USER: ${{ secrets.UC_SMTP_USER }}
          UC_SMTP_PASSWORD: ${{ secrets.UC_SMTP_PASSWORD }}
          UC_ALERT_RECIPIENT: ${{ secrets.UC_ALERT_RECIPIENT }}
        shell: bash
        run: |
          set -o pipefail
          uv run uc weekly --send | tee -a "$GITHUB_STEP_SUMMARY"
