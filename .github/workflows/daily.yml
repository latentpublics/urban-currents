# The daily run — **enabled** since 2026-08-19 (commit 478c187, a pre-0W
# SHA: `prompts/` was removed from the history in 0W and every hash before
# that point changed).
#
# The `schedule:` block below is live and fires at 21:00 UTC. It was turned on
# after the checklist in docs/OPERATIONS.md §"Turning the schedule on", which is
# ordered so that nothing can reach a stranger before someone has read what it
# would have said. That ordering still holds: `deliver.backend` is `file`, so
# nothing is posted to anybody — including, and this is the part that matters,
# the failure alerts (see the alerting step below and 0U, U2).
#
# Why this file exists before it runs: a scheduler that is written the day it is
# needed is written under time pressure, and the parts that get skipped are the
# ones that matter here — the lock, the conflict handling, the alert. It is
# easier to review a workflow nobody is depending on yet.

name: daily

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Issue date (YYYY-MM-DD). Blank means today."
        required: false
        type: string
      dry_run:
        description: "Run everything, write nothing, send nothing."
        required: false
        default: true
        type: boolean
      smoke:
        description: "Cheap check: narrow window, 3 summaries. Use for step 1."
        required: false
        default: false
        type: boolean

  # ENABLED 2026-08-19 (commit 478c187, pre-0W SHA), after working through the checklist in
  # docs/OPERATIONS.md — which is ordered so that nothing can reach a stranger
  # before a person has read what it would have said. **Read it again before
  # turning this off or changing the hour**: the ordering is the safeguard, not
  # the comment, and the deadman job (09:00 UTC) will go red 36 hours after the
  # last run-log row whether the schedule was disabled on purpose or not.
  #
  # 06:00 KST = 21:00 UTC the previous day. GitHub's scheduler is best-effort
  # and routinely runs late under load.
  #
  # ★ That used to be described here as costing nothing, and on 2026-08-26 it
  # cost a day. This slot is three hours from midnight UTC; the 08-26 run
  # started at about 00:35 on 08-27, dated itself from the clock, and published
  # an 08-27 issue. The reassurance was not wrong about the seven-day window, it
  # simply never did the arithmetic on the three hours of headroom the hour
  # itself leaves — and `uc catch-up` did not in fact retry "anything missed",
  # only days that had left a row behind.
  #
  # Both are fixed rather than worked around, so the hour did not need to move:
  # the run is dated from the slot (see "Resolve the issue date" below), and
  # catch-up walks the calendar. **If this hour changes, change
  # `daily.slot_hour_utc` in `config/pipeline.yaml` and `SLOT_HOUR_UTC` below in
  # the same commit** — `tests/test_slot_date.py` checks all three agree.
  #
  # A cron that never fires is caught by a missing run-log row, not by anybody
  # noticing the mail did not arrive — and since the 08-26 batch `deadman.yml`
  # looks for gaps behind the newest row as well as for the newest row's age.
  #
  schedule:
    - cron: "0 21 * * *"
    
# One run at a time, and a queued run waits rather than cancels: the pipeline
# holds its own file lock, and a cancelled job would leave that lock behind for
# the stale-reclaim path to clean up later. Belt and braces, cheaply.
concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write   # only to commit content/ and the run log. Nothing else.

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Job level, not step level, so no step added later can forget it.
    env:
      # Python buffers stdout when it is not a TTY, so a cancelled job loses the
      # whole buffer — which is why the 45-minute timeout produced 44 minutes of
      # silence and left us guessing where the time went (hotfix 2, H5-3).
      PYTHONUNBUFFERED: "1"

      # ★ The hour of the `cron:` slot above, in UTC, and the same number as
      # `daily.slot_hour_utc` in `config/pipeline.yaml`. Three copies of one
      # fact is two too many, so `tests/test_slot_date.py` reads all three out
      # of the files and fails if they disagree.
      #
      # It is here rather than only in config because the last step in this job
      # runs under `always()` — including when the install never finished, which
      # is exactly when there is no `uc` to ask. See that step.
      SLOT_HOUR_UTC: "21"

    steps:
      - uses: actions/checkout@v4
        with:
          # A shallow clone is enough: nothing in the pipeline reads history.
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.11

      # The embedding model is 440 MB and downloading it every morning is both
      # slow and rude to the host. Keyed on the model name from config, so a
      # model change misses the cache instead of silently using the old one.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-base-en-v1.5
          restore-keys: hf-${{ runner.os }}-

      # The cache H6 asked for: LLM responses, keyed by prompt version so an
      # edited prompt misses rather than serving stale text. 2.2MB.
      - name: Cache LLM responses
        uses: actions/cache@v4
        with:
          path: runs/cache
          key: llm-${{ hashFiles('config/pipeline.yaml') }}-${{ github.run_id }}
          restore-keys: |
            llm-${{ hashFiles('config/pipeline.yaml') }}-
            llm-

      # The resolved citation store (0T). 69MB and rewritten daily, so it is
      # cached rather than committed — a commit that size every day would bury
      # the archive it lives in. The three small state files that genuinely
      # cannot be regenerated moved to `content/state/` instead and are
      # committed with the rest (0U, U6).
      #
      # Losing this cache is not a failure: the queue simply refills from the
      # reference base and the chore re-resolves at $0.0001 a request. It would
      # be slow, not wrong.
      # `canon_pending.jsonl` rides along because it carries the **attempts**
      # counter, and that is the one thing in it that is not regenerable: the
      # work list refills from the reference base, but an id's strike count
      # does not, so without this the 3-strikes parking rule (0T) could never
      # fire on a runner. It is 4.6 MB and rewritten daily, which is why it is
      # cached rather than committed. A cache miss costs re-asking, not
      # correctness — ids already parked are in `content/state/`.
      - name: Cache the resolved citation store
        uses: actions/cache@v4
        with:
          path: |
            runs/state/canon_resolved.jsonl
            runs/state/canon_pending.jsonl
          key: canon-${{ github.run_id }}
          restore-keys: |
            canon-

      # ★ The cache nobody had listed, and the largest single cost on a runner.
      #
      # `.cache/embeddings/` holds one vector per abstract, keyed by text hash,
      # and it is gitignored — so CI embeds every candidate from scratch every
      # time. Measured here: **263 ms/item uncached** against 5.7 ms warm. A
      # normal day classifies ~870 items, which is 3.8 minutes on this laptop
      # and an estimated 8–15 on a two-core runner. That is the biggest
      # identified piece of the 44 minutes.
      #
      # Keyed on the embedding model, because vectors from one model are
      # meaningless to another. `github.run_id` in the primary key with prefix
      # restore-keys is the append-only pattern: every run restores the newest
      # matching cache and saves a superset.
      - name: Cache embedding vectors
        uses: actions/cache@v4
        with:
          path: .cache/embeddings
          key: emb-bge-base-en-v1.5-${{ github.run_id }}
          restore-keys: emb-bge-base-en-v1.5-

      - name: Install
        run: uv sync --extra embed --frozen

      # Downloaded in its own step so the 440MB shows up as its own line in the
      # log instead of hiding inside `classify`, where it was billed to the
      # pipeline's runtime and made the stage timings unreadable.
      - name: Warm the embedding model
        run: |
          uv run python -c "
          from pipeline.filters.embed import embed
          embed(['warm the model'], use_cache=False)
          print('embedding model ready')
          " 

      # ★ Which day is this run's day? (08-26 batch.)
      #
      # Not `date -u +%F`, and not `date.today()` inside the pipeline either.
      # Both answer "what is the wall clock now", and GitHub's scheduler is
      # best-effort: the 21:00 UTC slot for 2026-08-26 started at about 00:35
      # UTC on 08-27. The run dated itself 08-27, published an 08-27 issue,
      # wrote an 08-27 run-log row with `attempts: 1` — it had no idea it was
      # late — and 08-26 ended up with no issue, no row, and nothing anywhere
      # able to notice. Three and a half hours of ordinary lateness, and the
      # archive lost a day.
      #
      # `uc slot-date` answers the other question: which cron slot does this run
      # belong to. Past 21:00 UTC it is today, before it, yesterday. Twenty
      # hours late now costs nothing where three used to cost a day.
      #
      # A manual `date` input still wins — the operator asked for a date.
      - name: Resolve the issue date
        id: slot
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_DATE" ]; then
            day="$INPUT_DATE"
            echo "issue date from the workflow input: ${day}"
          else
            day="$(uv run uc slot-date)"
            echo "issue date from the ${SLOT_HOUR_UTC}:00 UTC slot: ${day} (now $(date -u +'%F %T') UTC)"
          fi
          echo "date=${day}" >> "$GITHUB_OUTPUT"
          echo "Issue date: \`${day}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Run the day
        id: run
        env:
          OPENALEX_KEY: ${{ secrets.OPENALEX_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SPRINGER_API_KEY: ${{ secrets.SPRINGER_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          UC_SMTP_USER: ${{ secrets.UC_SMTP_USER }}
          UC_SMTP_PASSWORD: ${{ secrets.UC_SMTP_PASSWORD }}
          UC_PREVIEW_RECIPIENT: ${{ secrets.UC_PREVIEW_RECIPIENT }}
          UC_ALERT_RECIPIENT: ${{ secrets.UC_ALERT_RECIPIENT }}
          # Inputs reach the shell as environment variables, never interpolated
          # into the script text. `${{ }}` inside `run:` is textual substitution
          # and turns any input into code — a bad habit to commit even where
          # only someone with write access can dispatch the workflow.
          # Already resolved above: the manual input if there was one, the cron
          # slot's date otherwise. Always passed, so `run_daily` never reaches
          # its `date.today()` fallback on a runner — that fallback stays for a
          # person typing `uc daily`, who does mean the day they are having.
          ISSUE_DATE: ${{ steps.slot.outputs.date }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_SMOKE: ${{ inputs.smoke }}
        run: |
          args=()
          if [ -n "$ISSUE_DATE" ]; then args+=(--date "$ISSUE_DATE"); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$INPUT_SMOKE" = "true" ]; then args+=(--smoke); fi

          # Three exits, three different facts, and they must not be merged:
          #   0  published or quiet
          #   1  not_published — a real outcome with a logged reason and an
          #      alert already sent, not a crash. The job continues so the
          #      commit step records the missed day.
          #   75 another run holds the lock. Not a missed day at all; the day
          #      is being worked on by someone else and this job has nothing
          #      to add.
          set +e
          uv run uc daily "${args[@]}"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          case $code in
            0)  ;;
            1)  echo "not_published=1" >> "$GITHUB_OUTPUT" ;;
            75) echo "locked=1" >> "$GITHUB_OUTPUT"
                echo "::warning::another run holds the lock; nothing to do" ;;
            *)  echo "::error::uc daily exited $code"; exit "$code" ;;
          esac

      # Retry the days we could not see. Skipped on a dry run and on a manual
      # run for one specific date, where the operator asked for that date only.
      #
      # Since the 08-26 batch this walks the calendar rather than the rows in
      # `content/runs_log/`, so a day that was never attempted is retried too.
      # It could not be before: the queue was built from the rows that existed,
      # and the whole problem with 08-26 was that no row existed.
      - name: Catch up on missed days
        if: ${{ inputs.dry_run != true && inputs.date == '' && steps.run.outputs.locked != '1' }}
        env:
          # The horizon ends at the slot date, not at `date.today()` on the
          # runner. A run that crossed midnight would otherwise measure its
          # seven days from tomorrow and drop the oldest one off the back.
          ISSUE_DATE: ${{ steps.slot.outputs.date }}
          OPENALEX_KEY: ${{ secrets.OPENALEX_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SPRINGER_API_KEY: ${{ secrets.SPRINGER_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          UC_ALERT_RECIPIENT: ${{ secrets.UC_ALERT_RECIPIENT }}
        run: uv run uc catch-up --date "$ISSUE_DATE" || true

      # Built here and thrown away, on purpose: since 0X the deploy happens in
      # `pages.yml`, and this is the pre-flight. A broken template fails the
      # day here, where the run log and the alert will say so, instead of
      # failing the deploy afterwards where a reader would meet it first.
      - name: Build the site
        if: ${{ inputs.dry_run != true }}
        run: uv run uc site --no-review

      # ★ Validate before committing (0U, U7). `uc validate` existed and no
      # workflow called it, so a malformed item or a dangling issue reference
      # would have been committed and then read by every later run. Failing
      # here costs one day's publication; committing it costs an archive that
      # no longer parses.
      - name: Validate content
        if: ${{ inputs.dry_run != true }}
        run: uv run uc validate

      # `content/` is the pipeline's output and the only thing worth persisting
      # from a run. `site/` is not committed: it is regenerable in a second and
      # a daily HTML diff would bury every real change.
      - name: Commit content
        if: ${{ inputs.dry_run != true }}
        run: |
          set -e
          git config user.name  "urban-currents[bot]"
          git config user.email "urban-currents@users.noreply.github.com"
          git add content/
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "content: $(date -u +%Y-%m-%d) run"

          # Someone may have pushed while we ran — a review edit, a config
          # change. Rebase and retry ONCE. If the second attempt also fails,
          # stop and alert: two failures in a row means a genuine conflict, and
          # a conflict in published content is a thing a person must look at.
          #
          # NEVER force push. The content directory is the archive; discarding
          # someone else's commit to make a bot's push succeed is the one
          # failure mode here that cannot be undone by running again.
          if ! git push; then
            echo "push rejected — rebasing onto origin and retrying once"
            git pull --rebase --no-edit origin "${GITHUB_REF_NAME}"
            git push
          fi

      # ★ Say it out loud when an alert could not reach anybody (0U, U2).
      #
      # `deliver.backend` is `file`, so `notify_failure` writes an `.eml` into
      # this runner and the runner is then destroyed. The old code returned
      # `alerted` for that, which is a false reassurance in the one place the
      # system is admitting something went wrong. It returns
      # `alert_undeliverable` now, and this surfaces it.
      #
      # The job-failure behaviour below is unchanged on purpose: a failed
      # workflow run is currently **the only signal that reaches a person**.
      - name: Report whether alerting can reach anyone
        if: ${{ always() && inputs.dry_run != true }}
        run: |
          if ! uv run uc status 2>/dev/null | grep -q "alerts reach"; then
            echo "::warning::uc status did not report alerting state"
            exit 0
          fi
          if uv run uc status 2>/dev/null | grep -q "alerts reach nobody"; then
            echo "::error::Failure alerts cannot reach anyone — deliver.backend is 'file', which writes into this runner and is then discarded. A failing day would be silent except for this workflow failing."
          fi

      # The last net (hotfix 2, H5-2). `uc daily` records its own death when it
      # is given the chance — a deadline it checks between stages, and a SIGTERM
      # handler for when a single stage overruns. This covers the case where
      # Python never gets to say anything at all: SIGKILL, an OOM, a runner
      # vanishing. Without it a killed job leaves no row, and a day with no row
      # is indistinguishable from a day the schedule never fired.
      # It commits and pushes on its own. On cancellation GitHub runs only the
      # `always()` steps, so the ordinary commit step never happens — a row
      # written here and left in the workspace would die with the runner, which
      # is the same silence this is meant to end.
      #
      # ★ It asks about the **slot date**, not `date -u +%F` (08-26 batch).
      # On the night this was written the two differed, and the difference is
      # the whole failure: the job had crossed midnight, `date -u` said 08-27,
      # the row for 08-27 had just been written by the run itself, and the step
      # reported "already written" and passed. The day it was meant to protect —
      # 08-26 — was never in its field of view. A net that checks the wrong day
      # reports success for the same reason an empty room is quiet.
      #
      # The slot step may not have run (a failed install, a cancelled checkout),
      # so the hour rule is repeated here in bash. It is repeated, not derived,
      # because deriving it needs the thing that failed to install; the
      # duplication is pinned by `tests/test_slot_date.py`.
      - name: Record an interrupted run
        if: ${{ always() && inputs.dry_run != true }}
        env:
          SLOT_DATE: ${{ steps.slot.outputs.date }}
        run: |
          day="$SLOT_DATE"
          if [ -z "$day" ]; then
            if [ "$(date -u +%H)" -ge "$SLOT_HOUR_UTC" ]; then
              day="$(date -u +%Y-%m-%d)"
            else
              day="$(date -u -d 'yesterday' +%Y-%m-%d)"
            fi
            echo "::warning::The slot step did not run; the ${SLOT_HOUR_UTC}:00 UTC rule was applied here instead — ${day}."
          fi

          if [ -f "content/runs_log/${day}.json" ]; then
            echo "run log already written — the pipeline recorded its own verdict"
            exit 0
          fi

          echo "::warning::No run-log row for ${day} — recording it as interrupted."
          uv run uc record-interrupted --date "${day}" \
            --reason "the job ended without a verdict (cancelled, timed out, or the runner died)" || true

          if [ ! -f "content/runs_log/${day}.json" ]; then
            echo "::error::Could not write an interrupted row either."
            exit 0
          fi

          git config user.name  "urban-currents[bot]"
          git config user.email "urban-currents@users.noreply.github.com"
          git add "content/runs_log/${day}.json"
          git commit -m "content: ${day} interrupted" || exit 0
          git push || {
            git pull --rebase --no-edit origin "${GITHUB_REF_NAME}" && git push
          } || echo "::error::Could not push the interrupted row."

      - name: Report
        if: always()
        run: uv run uc status || true

      # A dry run that publishes nothing does not fail the job — a quiet
      # weekend is a legitimate `not_published` and failing on it would train
      # everyone to ignore a red cross. **But it must not pass silently.**
      #
      # It did, and that is why YJUN's step 1 looked fine and step 2 did not
      # (hotfix H3). The point of a rehearsal is to find out before turning it
      # on, and this one found out and said nothing.
      - name: Warn if the dry run published nothing
        if: ${{ steps.run.outputs.not_published == '1' && inputs.dry_run == true }}
        run: |
          reasons=$(uv run uc status 2>/dev/null | tail -40 || true)
          {
            echo "### Dry run published nothing"
            echo ""
            echo "This can be legitimate — a quiet weekend reads the same way."
            echo "It is **not** legitimate when the reasons mention SKIPPED or"
            echo "FAILED: that is configuration missing, not a quiet day."
            echo ""
            echo '```'
            echo "$reasons"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Case-sensitive on purpose. `uc status` prints a JSON block whose
          # keys include `last_run_skipped`, and the old `-i` matched *that*,
          # so the guard would have fired on every dry run once U2 gave it
          # something to read. Only the uppercase words the human lines print
          # count (0U, U10).
          if uv run uc status 2>/dev/null | grep -qE "SKIPPED|FAILED|silent_sources.*\[[^]]"; then
            echo "::error::The dry run did not publish AND a stage was skipped or failed. This is setup, not a quiet day — check repository secrets (step 0 in docs/OPERATIONS.md)."
          else
            echo "::warning::The dry run published nothing. If today was genuinely quiet this is fine; check the summary."
          fi

      # A workflow that fails silently is the same failure this whole phase is
      # about. The pipeline alerts by mail on `not_published`; this catches the
      # case the pipeline could not reach — the job itself dying, which mails
      # nobody because nothing got far enough to try.
      - name: Fail the job if the day was not published
        if: ${{ steps.run.outputs.not_published == '1' && inputs.dry_run != true }}
        run: |
          echo "::error::No issue was published. See the run log and uc status."
          exit 1
