# Controlled vocabulary — methods. Two levels: family → method.
#
# Entries marked `review: true` were bootstrapped automatically from training-set
# abstracts by `scripts/bootstrap_vocab.py` and have NOT been curated by a human.
# Curating them is a Phase 0 manual task: check the label, fold duplicates into
# `aliases`, set the right family, then delete the `review` key.
#
# `id` must start with `method:` — free strings never reach `entities`.

families:
  - id: method:deep-learning
    label: deep learning
    aliases: [neural network, neural networks, deep neural network]
    methods:
      - id: method:gnn
        label: graph neural network
        aliases: [gnn, gnns, graph neural networks, graph convolutional network, gcn,
                  graph attention network, gat, message passing neural network]
