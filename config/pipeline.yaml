# Pipeline configuration. Values here are meant to be tuned during Phase 0.

arxiv:
  # PRD §5.1
  categories: [cs.CY, cs.SI, cs.LG, cs.CV, cs.AI, stat.AP, physics.soc-ph]
  request_interval_s: 5.0      # PRD §5.1 asks for >= 3s; 5 avoids 429s in practice
  max_retries: 3
  # 1000 rather than 200. A 90-day backfill is ~39,000 items; at 200 per request
  # that is ~200 requests and arXiv starts returning 429 partway through, which
  # costs far more time than the larger responses do. Measured: a 1000-entry
  # page returns in ~3s.
  page_size: 1000
  api_url: "http://export.arxiv.org/api/query"

openalex:
  # A free key gives a $1/day budget. We stop a stage at 80% of it.
  daily_budget_usd: 1.0
  budget_stop_fraction: 0.8
  per_page: 100          # hard maximum as of 2026-08; the docs previously said 200
  arxiv_source_id: "S4306400194"
  # Subfields used to build the journal whitelist (PRD §5.4).
  whitelist_subfields: ["3322", "3305", "3313"]
  whitelist_max_sources: 200

embedding:
  provider: local              # local | none. Swappable for a hosted API later.
  model: "BAAI/bge-base-en-v1.5"
  batch_size: 32

classifier:
  # Calibrated probability, so this cut is interpretable. Set from the measured
  # per-source sweep in models/clf-*.json rather than left at 0.5:
  #
  #   thr    arXiv-urban recall   journal recall   negative FPR   holdout precision
  #   0.50         0.682               0.995          0.044            0.953
  #   0.35         0.768               0.998          0.094            0.907
  #   0.25         0.820               0.998          0.142            0.867
  #
  # At 0.5 the model drops a third of the arXiv urban papers this product exists
  # to surface. Recall is worth more than precision here because `select_top_n`
  # already caps daily volume and items are ranked by score — a lower floor
  # changes what can reach the list, not how long the list is.
  # REVIEW: YJUN's call. 0.25 buys 5 more points of arXiv recall for 4 points of
  # precision; 0.5 is the conservative end.
  # Which trained model is in production. Named explicitly: with several
  # variants on disk, picking the last filename alphabetically selects v3, which
  # the comparison showed is the worst of the three.
  model_version: "clf-v2-2026-08-13"

  threshold: 0.35
  select_top_n: 24             # kept for reference; selection.slots is authoritative
  holdout_fraction: 0.2
  random_state: 42

selection:
  # Two independent entry paths (roadmap §2.1). A whitelist-journal article
  # enters on membership and never touches the classifier; an arXiv preprint
  # enters on classifier probability. Each path owns its slots, which is why the
  # old `classifier.arxiv_min_share` quota is gone — it was treating a symptom.
  # A path that cannot fill its slots lends them to the other, and the run
  # records that it happened.
  # REVIEW: YJUN's call on the split.
  slots:
    journal: 12
    arxiv: 12

llm:
  # gemini | anthropic. The Anthropic path is kept working; the account simply
  # has no credit. Summaries and extraction can move to different providers
  # later — that is why this is not hard-coded.
  provider: gemini
  model: "gemini-3.5-flash"
  max_tokens: 1200

  # Thinking OFF, and this is a cost setting, not a quality one. Gemini 3.x
  # bills reasoning tokens as output. Measured on a one-word prompt:
  # thinking_level="low" -> 95 thought tokens, thinking_budget=0 -> 0.
  # This work is formatting, not reasoning.
  thinking: false

  cache_enabled: true

  # Hard stops so a development loop cannot burn the budget quietly.
  #
  # `max_calls_total` is per task and counts calls, not money — it is a
  # runaway-loop guard, and `max_spend_usd` is the one that guards the wallet.
  # Raised from 200 in phase 0c: a prompt version bump necessarily invalidates
  # that task's cache, so 0.3.0 -> 0.4.0 (the no-verbatim rule) means
  # re-summarising the whole archive, and 148 + 120 already crossed the old
  # ceiling. Measured spend at the time: $0.76 of the $10 that actually binds.
  max_calls_per_run: 60
  max_calls_total: 600
  max_spend_usd: 10.0

  # Per-task overrides. Each task owns its prompt version, so editing one
  # prompt does not invalidate the other's cache (the reason D8 was reverted).
  summarize:
    prompt_version: "summarize/papers@0.4.0"
    max_tokens: 900
  extract:
    prompt_version: "extract/overlay@0.1.0"
    max_tokens: 600

gate:
  # Low-volume, high-yield categories skip the keyword gate entirely (PRD §5.3).
  ungated_categories: [cs.CY, cs.SI, stat.AP, physics.soc-ph]
  gated_categories: [cs.LG, cs.CV, cs.AI]

review:
  minutes_saved_per_item: 7

citation:
  # Bibliographic coupling: two papers sharing references. Computable the day
  # both appear, which is the point — co-citation needs the field to have
  # reacted, and this does not.
  #
  # Minimum shared references to record a pair. One or two shared references is
  # mostly coincidence in a field with a common canon; the measured distribution
  # is in the phase 0d report.
  min_shared_references: 3
  # Coupling over the whole archive is O(n^2) and the archive grows daily.
  # Pairs are only computed within this many days of each other, which is also
  # the honest scope: "read this alongside" is a claim about what is current.
  coupling_window_days: 90
  # Canon candidates: how many of the most-cited works to resolve and keep.
  canon_top_n: 300
  # Entry to the canon list: our own corpus cited it at least this many times.
  # One citation is one paper's reading list; two is a shared reference.
  canon_min_citations: 2
  # venue | subfield | both.  was the original rule — published in a
  # whitelist journal — and it let a 159-entry operational list overrule our own
  # corpus.  excludes generic research instruments by OpenAlex
  # classification instead (vocab/canon_exclude_subfields.yaml), which is what
  # the exclusion is actually about. Kept switchable so the change is testable.
  canon_scope_mode: subfield
  # A citation from a recent item counts for more. Half-life in days: an item
  # published a year ago contributes about a quarter of a fresh one.
  canon_half_life_days: 180

canon:
  # Daily accumulation takes at most this share of the OpenAlex day budget.
  # The collectors need the rest: a canon that crowds out collection has its
  # priorities backwards. What the budget cannot resolve waits in
  # runs/state/canon_pending.jsonl and is tried first the next day, and the
  # queue length goes into metrics so a queue that only grows is visible.
  # Which class a rotating canon card draws from first. `foundation` is what
  # the field is built on; `instrument` is what it runs on. Both lists are
  # kept and both are worth publishing, but the default lead is foundation.
  card_class_priority: [foundation, instrument]
  daily_budget_fraction: 0.2
  # And a wall-clock ceiling, which is the one that actually binds. On cost
  # alone a fifth of the day budget buys 50,000 ids, or 1,000 requests and the
  # better part of an hour. 40 requests is 2,000 ids a run.
  max_requests_per_run: 40
